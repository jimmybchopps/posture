suite: networkpolicy rules
templates:
  - templates/networkpolicy/rules.yaml
set:
  allowDNS: false
tests:
  # Peer translation (CLAUDE.md, "Peer translation")
  - it: workload, namespace omitted -> podSelector only
    set:
      ingress.grafana.from.renderer: { ports: [3000] }
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: allow-ingress-from-renderer-to-grafana }
      - equal: { path: 'metadata.annotations["posture.dev/rule"]', value: ingress.grafana.from.renderer }
      - equal:
          path: spec
          value:
            podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
            policyTypes: [Ingress]
            ingress:
              - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: renderer } } }]
                ports: [{ port: 3000, protocol: TCP }]

  - it: workload + namespace X -> podSelector + namespaceSelector on the namespace name
    set:
      ingress.grafana.from.keycloak: { namespace: keycloak, ports: [3000] }
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - podSelector: { matchLabels: { app.kubernetes.io/name: keycloak } }
              namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: keycloak } }

  - it: workload + namespace any -> podSelector + namespaceSelector {}
    set:
      ingress.grafana.from.prometheus: { namespace: any, ports: [3000] }
    asserts:
      - equal:
          path: spec.ingress[0].from
          value: [{ podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }, namespaceSelector: {} }]

  - it: any, namespace omitted -> podSelector {}
    set:
      ingress.grafana.from.any: { ports: [3000] }
    asserts:
      - equal: { path: 'spec.ingress[0].from', value: [{ podSelector: {} }] }

  - it: any + namespace X -> namespaceSelector only
    set:
      ingress.grafana.from.any: { namespace: tooling, ports: [3000] }
    asserts:
      - equal:
          path: spec.ingress[0].from
          value: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: tooling } } }]

  - it: any + namespace any -> namespaceSelector {}
    set:
      ingress.grafana.from.any: { namespace: any, ports: [3000] }
    asserts:
      - equal: { path: 'spec.ingress[0].from', value: [{ namespaceSelector: {} }] }

  - it: cidrs -> one ipBlock per CIDR, except only when set
    set:
      ingress.grafana.from.office: { cidrs: [10.50.0.0/16, { cidr: 10.60.0.0/16, except: [10.60.1.0/24] }], ports: [3000] }
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - ipBlock: { cidr: 10.50.0.0/16 }
            - ipBlock: { cidr: 10.60.0.0/16, except: [10.60.1.0/24] }

  - it: a raw podSelector from a destination definition
    set:
      egress.grafana.destinations: { dns: {} }
    asserts:
      - equal:
          path: spec.egress[0].to
          value:
            - podSelector: { matchLabels: { k8s-app: kube-dns } }
              namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }

  - it: ingress.any targets every pod
    set:
      ingress.any.from.any: { namespace: tooling, ports: [8080] }
    asserts:
      - equal: { path: metadata.name, value: allow-ingress-from-all-in-tooling-to-all }
      - equal: { path: spec.podSelector, value: {} }

  - it: egress rules use egress, to, and policyTypes Egress
    set:
      egress.grafana.to.keycloak: { namespace: keycloak, ports: [8080] }
    asserts:
      - equal: { path: metadata.name, value: allow-egress-from-grafana-to-keycloak }
      - equal:
          path: spec
          value:
            podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
            policyTypes: [Egress]
            egress:
              - to:
                  - podSelector: { matchLabels: { app.kubernetes.io/name: keycloak } }
                    namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: keycloak } }
                ports: [{ port: 8080, protocol: TCP }]

  # Ports
  - it: renders every port form, as integers
    set:
      ingress.grafana.from.renderer: { ports: [3000, { port: 53, protocol: UDP }, { port: 9400, endPort: 9499 }] }
    asserts:
      - equal:
          path: spec.ingress[0].ports
          value: [{ port: 3000, protocol: TCP }, { port: 53, protocol: UDP }, { port: 9400, endPort: 9499, protocol: TCP }]

  - it: ports from a values file come out as integers
    values:
      - ../values/ports.yaml
    asserts:
      - equal: { path: 'spec.ingress[0].ports[0].port', value: 3000 }
      - equal: { path: 'spec.ingress[0].ports[1].endPort', value: 9499 }

  # Istio ambient: 15008
  - it: istio adds TCP 15008 to in-cluster ingress rules
    set:
      mesh: istio
      ingress.grafana.from.keycloak: { namespace: keycloak, ports: [3000] }
    asserts:
      - equal: { path: 'spec.ingress[0].ports', value: [{ port: 3000, protocol: TCP }, { port: 15008, protocol: TCP }] }

  - it: istio adds TCP 15008 to in-cluster egress rules
    set:
      mesh: istio
      egress.grafana.destinations: { vault: {} }
      destinations.vault: { namespace: vault, workload: vault, ports: [8200] }
    asserts:
      - equal: { path: 'spec.egress[0].ports', value: [{ port: 8200, protocol: TCP }, { port: 15008, protocol: TCP }] }

  - it: istio doesn't add 15008 to cidrs rules
    set:
      mesh: istio
      egress.grafana.destinations: { postgres: {} }
    asserts:
      - equal: { path: 'spec.egress[0].ports', value: [{ port: 5432, protocol: TCP }] }

  - it: istio doesn't duplicate 15008 already listed (egress-gateway)
    set:
      mesh: istio
      egress.grafana.destinations: { egress-gateway: {} }
    asserts:
      - equal: { path: 'spec.egress[0].ports', value: [{ port: 15008, protocol: TCP }] }

  - it: istio still adds TCP 15008 next to UDP 15008
    set:
      mesh: istio
      ingress.grafana.from.renderer: { ports: [{ port: 15008, protocol: UDP }] }
    asserts:
      - equal: { path: 'spec.ingress[0].ports', value: [{ port: 15008, protocol: UDP }, { port: 15008, protocol: TCP }] }

  - it: mesh none never adds 15008
    set:
      ingress.grafana.from.keycloak: { namespace: keycloak, ports: [3000] }
    asserts:
      - equal: { path: 'spec.ingress[0].ports', value: [{ port: 3000, protocol: TCP }] }

  # Directions and DNS
  - it: allowDNS renders as an egress rule from every pod
    set:
      allowDNS: true
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: allow-egress-from-all-to-dns }
      - equal: { path: 'metadata.annotations["posture.dev/rule"]', value: allowDNS }
      - equal: { path: spec.podSelector, value: {} }

  - it: ingress off skips ingress rules but keeps egress rules
    set:
      networkPolicy.ingress: false
      ingress.grafana.from.renderer: { ports: [3000] }
      egress.grafana.to.keycloak: { namespace: keycloak, ports: [8080] }
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: allow-egress-from-grafana-to-keycloak }

  - it: egress off skips egress rules and allowDNS
    set:
      allowDNS: true
      networkPolicy.egress: false
      ingress.grafana.from.renderer: { ports: [3000] }
      egress.grafana.to.keycloak: { namespace: keycloak, ports: [8080] }
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: allow-ingress-from-renderer-to-grafana }

  - it: a disabled direction still validates its rules
    set:
      networkPolicy.egress: false
      egress.grafana.destinations: { postgress: {} }
    asserts:
      - failedTemplate:
          errorPattern: 'unknown destination "postgress"'

  - it: namePrefix applies to rule objects
    set:
      namePrefix: team-a
      ingress.grafana.from.renderer: { ports: [3000] }
    asserts:
      - equal: { path: metadata.name, value: team-a-allow-ingress-from-renderer-to-grafana }

  # enabled (phase 5a): disabled entries render nothing
  - it: a disabled peer renders nothing; its sibling renders
    set:
      ingress.grafana.from:
        renderer: { ports: [3000], enabled: false }
        keycloak: { namespace: keycloak, ports: [3000] }
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: allow-ingress-from-keycloak-to-grafana }

  - it: a disabled rule renders none of its peers or references
    set:
      ingress.grafana:
        enabled: false
        from: { renderer: { ports: [3000] } }
        sources: { monitoring: [3000] }
      egress.grafana:
        enabled: false
        to: { keycloak: { namespace: keycloak, ports: [8080] } }
        destinations: { postgres: {} }
    asserts:
      - hasDocuments: { count: 0 }

  - it: disabled source and destination references render nothing
    set:
      ingress.grafana.sources:
        monitoring: { ports: [3000], enabled: false }
        ingress-gateway: [3000]
      egress.grafana.destinations:
        postgres: { enabled: false }
        sso: {}
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: metadata.name, value: allow-ingress-from-ingress-gateway-to-grafana }
        documentIndex: 0
      - equal: { path: metadata.name, value: allow-egress-from-grafana-to-sso }
        documentIndex: 1

  - it: enabled true is the same as leaving it out
    set:
      ingress.grafana: { enabled: true, from: { renderer: { ports: [3000], enabled: true } } }
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: allow-ingress-from-renderer-to-grafana }

  - it: disabled entries render nothing under mesh istio either
    set:
      mesh: istio
      ingress.grafana.from.renderer: { ports: [3000], enabled: false }
      egress.grafana.destinations.egress-gateway: { enabled: false }
    asserts:
      - hasDocuments: { count: 0 }

  # Gateway presets (phase 5b): each gateway in its own namespace
  - it: ingress-gateway is every pod in namespace ingress-gateway
    set:
      ingress.grafana.sources.ingress-gateway: [3000]
    asserts:
      - equal:
          path: spec.ingress[0].from
          value: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-gateway } } }]

  - it: egress-gateway is every pod in namespace egress-gateway, on 15008 once
    set:
      mesh: istio
      egress.grafana.destinations: { egress-gateway: {} }
    asserts:
      - equal:
          path: spec.egress[0].to
          value: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: egress-gateway } } }]
      - equal: { path: 'spec.egress[0].ports', value: [{ port: 15008, protocol: TCP }] }

  - it: the old shared namespace is one override away
    set:
      sources.ingress-gateway: { namespace: gateway }
      ingress.grafana.sources.ingress-gateway: [3000]
    asserts:
      - equal:
          path: spec.ingress[0].from
          value: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: gateway } } }]

  # Egress to hostnames: one rule to the waypoint, whatever the number of entries
  - it: allowedHosts adds one rule from every pod to the egress waypoint
    set:
      mesh: istio
      egress.allowedHosts:
        github: { hosts: [api.github.com], ports: [443] }
        mirror: { hosts: [mirror.example.com], ports: [80], protocol: HTTP }
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: allow-egress-from-all-to-egress-gateway }
      - equal: { path: 'metadata.annotations["posture.dev/rule"]', value: egress.allowedHosts }
      - equal: { path: spec.podSelector, value: {} }
      - equal:
          path: spec.egress[0].to
          value: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: egress-gateway } } }]
      - equal: { path: 'spec.egress[0].ports', value: [{ port: 15008, protocol: TCP }] }

  - it: allowedHosts with every entry disabled renders no waypoint rule
    set:
      egress.allowedHosts.github: { hosts: [api.github.com], ports: [443], enabled: false }
    asserts:
      - hasDocuments: { count: 0 }

  - it: the waypoint rule follows an overridden egress-gateway destination
    set:
      mesh: istio
      destinations.egress-gateway: { namespace: egress, workload: waypoint }
      egress.allowedHosts.github: { hosts: [api.github.com], ports: [443] }
    asserts:
      - equal:
          path: spec.egress[0].to
          value:
            - podSelector: { matchLabels: { app.kubernetes.io/name: waypoint } }
              namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: egress } }

  - it: the waypoint rule is skipped with NetworkPolicy egress off
    set:
      mesh: istio
      networkPolicy.egress: false
      egress.allowedHosts.github: { hosts: [api.github.com], ports: [443] }
    asserts:
      - hasDocuments: { count: 0 }
