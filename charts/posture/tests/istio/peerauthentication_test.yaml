suite: istio peer authentications
templates:
  - templates/istio/peerauthentication.yaml
release:
  namespace: grafana
set:
  mesh: istio
tests:
  - it: renders nothing with mesh none
    set:
      mesh: none
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders nothing with inherit
    set:
      mtls.mode: inherit
    asserts:
      - hasDocuments: { count: 0 }

  - it: STRICT by default, for the whole namespace
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: PeerAuthentication }
      - isAPIVersion: { of: security.istio.io/v1 }
      - equal: { path: metadata.name, value: mtls-strict }
      - equal: { path: metadata.namespace, value: grafana }
      - equal: { path: 'metadata.annotations["posture.dev/rule"]', value: mtls.mode }
      - equal: { path: spec, value: { mtls: { mode: STRICT } } }

  - it: PERMISSIVE for the whole namespace
    set:
      mtls.mode: PERMISSIVE
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: mtls-permissive }
      - equal: { path: spec, value: { mtls: { mode: PERMISSIVE } } }

  - it: an exclusion keeps the workload STRICT except the listed ports, which are PERMISSIVE
    set:
      mtls.exclusions.api: [8081, 8082, 8081]
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: metadata.name, value: allow-plaintext-to-api }
        documentIndex: 1
      - equal: { path: 'metadata.annotations["posture.dev/rule"]', value: mtls.exclusions.api }
        documentIndex: 1
      - equal:
          path: spec
          value:
            selector: { matchLabels: { app.kubernetes.io/name: api } }
            mtls: { mode: STRICT }
            portLevelMtls:
              "8081": { mode: PERMISSIVE }
              "8082": { mode: PERMISSIVE }
        documentIndex: 1

  - it: an exclusion's selector picks the label
    set:
      mtls.exclusions.web: { selector: instance, ports: [9090] }
    asserts:
      - equal: { path: spec.selector, value: { matchLabels: { app.kubernetes.io/instance: web } } }
        documentIndex: 1

  - it: namePrefix applies
    set:
      namePrefix: team-a
      mtls.exclusions.api: [8081]
    asserts:
      - equal: { path: metadata.name, value: team-a-mtls-strict }
        documentIndex: 0
      - equal: { path: metadata.name, value: team-a-allow-plaintext-to-api }
        documentIndex: 1

  - it: renders whatever authorization and networkPolicy say
    set:
      authorization.enabled: false
      networkPolicy: { ingress: false, egress: false }
    asserts:
      - hasDocuments: { count: 1 }

  # enabled (phase 5a)
  - it: a disabled exclusion renders no PeerAuthentication; an enabled one does
    set:
      mtls.exclusions.api: { ports: [8081], enabled: false }
      mtls.exclusions.web: { ports: [9090] }
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: metadata.name, value: allow-plaintext-to-web }
        documentIndex: 1
