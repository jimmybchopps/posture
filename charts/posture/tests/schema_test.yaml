suite: values schema
templates:
  - templates/*.yaml
tests:
  - it: accepts a valid namePrefix and name-shaped map keys
    set:
      namePrefix: team-a
      sources:
        backup-agent: { namespace: backup, workload: velero }
      destinations:
        license-server: { cidrs: [10.30.0.15/32], ports: [27000] }
      ingress:
        grafana: { sources: { backup-agent: [3000] } }
        any: { from: { any: { namespace: tooling, ports: [8080] } } }
      egress:
        prometheus2: { destinations: [license-server] }
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown top-level key
    set:
      exception:
        legacy: { policies: { require-run-as-non-root: { kind: ValidatingAdmissionPolicy } } }
    asserts:
      - failedTemplate:
          errorPattern: "exception"

  - it: rejects a mesh that isn't supported yet
    set:
      mesh: linkerd
    asserts:
      - failedTemplate:
          errorPattern: "mesh"

  - it: rejects a misspelled networkPolicy direction
    set:
      networkPolicy:
        ingres: false
    asserts:
      - failedTemplate:
          errorPattern: "ingres"

  - it: rejects a non-boolean allowDNS
    set:
      allowDNS: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "allowDNS"

  - it: rejects an empty trustDomain
    set:
      trustDomain: ""
    asserts:
      - failedTemplate:
          errorPattern: "trustDomain"

  - it: rejects a namePrefix that isn't a valid name part
    set:
      namePrefix: Team_A
    asserts:
      - failedTemplate:
          errorPattern: "namePrefix"

  - it: rejects an uppercase key in ingress
    set:
      ingress:
        Grafana: { sources: { monitoring: [3000] } }
    asserts:
      - failedTemplate:
          errorPattern: "Grafana"

  - it: rejects a key with an underscore in sources
    set:
      sources:
        backup_agent: { cidrs: [10.0.0.0/8] }
    asserts:
      - failedTemplate:
          errorPattern: "backup_agent"

  - it: rejects a key ending in a hyphen in destinations
    set:
      destinations:
        vault-: { cidrs: [10.0.0.0/8], ports: [8200] }
    asserts:
      - failedTemplate:
          errorPattern: "vault-"

  - it: rejects a key with a dot in egress
    set:
      egress:
        grafana.v2: { destinations: [dns] }
    asserts:
      - failedTemplate:
          errorPattern: "grafana.v2"

  # Ports
  - it: rejects a named port
    set:
      ingress.grafana.from.renderer: { ports: [http] }
    asserts:
      - failedTemplate: {}

  - it: rejects a named port in a port object
    set:
      ingress.grafana.from.renderer: { ports: [{ port: http }] }
    asserts:
      - failedTemplate: {}

  - it: rejects an empty ports list
    set:
      ingress.grafana.from.renderer: { ports: [] }
    asserts:
      - failedTemplate: {}

  - it: rejects an entry without ports
    set:
      ingress.grafana.from.renderer: { namespace: x }
    asserts:
      - failedTemplate: {}

  - it: rejects a sources reference without ports
    set:
      ingress.grafana.sources.monitoring: []
    asserts:
      - failedTemplate: {}

  - it: rejects port 0 and port 65536
    set:
      ingress.grafana.from.renderer: { ports: [0, 65536] }
    asserts:
      - failedTemplate: {}

  - it: rejects an unknown protocol
    set:
      ingress.grafana.from.renderer: { ports: [{ port: 53, protocol: ICMP }] }
    asserts:
      - failedTemplate: {}

  - it: rejects a misspelled ports key
    set:
      ingress.grafana.from.renderer: { port: [3000] }
    asserts:
      - failedTemplate: {}

  # Selectors and any
  - it: rejects an unknown selector
    set:
      ingress.grafana: { selector: label, from: { renderer: { ports: [3000] } } }
    asserts:
      - failedTemplate: {}

  - it: rejects a selector on from.any
    set:
      ingress.grafana.from.any: { selector: instance, ports: [3000] }
    asserts:
      - failedTemplate: {}

  - it: rejects a serviceAccount on to.any
    set:
      egress.grafana.to.any: { serviceAccount: x, ports: [3000] }
    asserts:
      - failedTemplate: {}

  - it: rejects serviceAccount any
    set:
      ingress.grafana.from.keycloak: { serviceAccount: any, ports: [3000] }
    asserts:
      - failedTemplate: {}

  - it: rejects serviceAccount any on a source definition
    set:
      sources.monitoring: { serviceAccount: any }
    asserts:
      - failedTemplate: {}

  - it: rejects any as a source name
    set:
      sources.any: { namespace: x, workload: y }
    asserts:
      - failedTemplate: {}

  - it: rejects any as a sources reference
    set:
      ingress.grafana.sources.any: [3000]
    asserts:
      - failedTemplate: {}

  - it: rejects any as a destinations reference
    set:
      egress.grafana.destinations: [any]
    asserts:
      - failedTemplate: {}

  # Entry shapes
  - it: rejects cidrs together with namespace in a from entry
    set:
      ingress.grafana.from.office: { cidrs: [10.0.0.0/8], namespace: x, ports: [3000] }
    asserts:
      - failedTemplate: {}

  - it: rejects a malformed CIDR
    set:
      ingress.grafana.from.office: { cidrs: [10.0.0.0], ports: [3000] }
    asserts:
      - failedTemplate: {}

  - it: rejects an out-of-range CIDR
    set:
      destinations.x: { cidrs: [10.0.0.256/8], ports: [1] }
    asserts:
      - failedTemplate: {}

  - it: accepts IPv6 CIDRs and except lists
    set:
      ingress.grafana.from.office: { cidrs: ["2001:db8::/32", { cidr: 10.0.0.0/8, except: [10.1.0.0/16] }], ports: [3000] }
    asserts:
      - notFailedTemplate: {}

  - it: rejects an ingress rule with neither from nor sources
    set:
      ingress.grafana: { selector: app }
    asserts:
      - failedTemplate: {}

  - it: rejects an empty from map
    set:
      ingress.grafana: { from: {} }
    asserts:
      - failedTemplate: {}

  - it: rejects an egress rule with neither to nor destinations
    set:
      egress.grafana: { selector: app }
    asserts:
      - failedTemplate: {}

  - it: rejects ports on a source definition
    set:
      sources.monitoring: { ports: [9090] }
    asserts:
      - failedTemplate: {}

  - it: rejects an empty podSelector
    set:
      sources.monitoring: { podSelector: {} }
    asserts:
      - failedTemplate: {}

  - it: rejects requiresMesh in user values
    set:
      destinations.egress-gateway: { requiresMesh: { mesh: none } }
    asserts:
      - failedTemplate: {}

  - it: accepts authorization.enabled false
    set:
      mesh: istio
      authorization.enabled: false
    asserts:
      - notFailedTemplate: {}

  - it: rejects a non-boolean authorization.enabled
    set:
      authorization.enabled: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "authorization"

  - it: rejects an unknown key under authorization
    set:
      authorization.mode: strict
    asserts:
      - failedTemplate:
          errorPattern: "authorization"

  - it: accepts every mtls mode except DISABLE
    set:
      mesh: istio
      mtls.mode: inherit
    asserts:
      - notFailedTemplate: {}

  - it: rejects mtls mode DISABLE
    set:
      mtls.mode: DISABLE
    asserts:
      - failedTemplate:
          errorPattern: "mtls"

  - it: accepts exclusions as a list or as selector and ports
    set:
      mesh: istio
      mtls.exclusions.api: [8081]
      mtls.exclusions.web: { selector: instance, ports: [9090] }
    asserts:
      - notFailedTemplate: {}

  - it: rejects exclusions.any
    set:
      mesh: istio
      mtls.exclusions.any: [8081]
    asserts:
      - failedTemplate:
          errorPattern: "any"

  - it: rejects a port object in exclusions (single TCP port numbers only)
    set:
      mesh: istio
      mtls.exclusions.api: [{ port: 8081, protocol: UDP }]
    asserts:
      - failedTemplate:
          errorPattern: "exclusions"

  - it: rejects an empty exclusion port list
    set:
      mesh: istio
      mtls.exclusions.api: []
    asserts:
      - failedTemplate:
          errorPattern: "exclusions"

  - it: accepts every exceptions field
    set:
      policyExceptions.enabled: true
      exceptions:
        prometheus:
          selector: instance
          policies:
            disallow-host-path: { kind: ValidatingAdmissionPolicy, reason: why, expires: "2027-03-31", enabled: true }
            add-default-resources: { kind: MutatingAdmissionPolicy }
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown policyExceptions key
    set:
      policyExceptions.enable: true
    asserts:
      - failedTemplate:
          errorPattern: "enable"

  - it: rejects exceptions.any
    set:
      exceptions.any.policies.disallow-host-path: { kind: ValidatingAdmissionPolicy }
    asserts:
      - failedTemplate: {}

  - it: rejects exceptions without policies
    set:
      exceptions.prometheus: { selector: name }
    asserts:
      - failedTemplate:
          errorPattern: "policies"

  - it: rejects an empty policies map
    set:
      exceptions.prometheus.policies: {}
    asserts:
      - failedTemplate: {}

  - it: rejects a policy name that isn't a DNS label
    set:
      exceptions.prometheus.policies.Disallow_Host_Path: { kind: ValidatingAdmissionPolicy }
    asserts:
      - failedTemplate: {}

  - it: rejects a policy name over 63 characters
    set:
      exceptions.prometheus.policies.a-policy-name-that-is-much-longer-than-sixty-three-characters-long: { kind: ValidatingAdmissionPolicy }
    asserts:
      - failedTemplate: {}

  - it: requires kind
    set:
      exceptions.prometheus.policies.disallow-host-path: { reason: why }
    asserts:
      - failedTemplate:
          errorPattern: "kind"

  - it: rejects an unknown kind
    set:
      exceptions.prometheus.policies.disallow-host-path: { kind: ClusterPolicy }
    asserts:
      - failedTemplate:
          errorPattern: "kind"

  - it: rejects a malformed expires
    set:
      exceptions.prometheus.policies.disallow-host-path: { kind: ValidatingAdmissionPolicy, expires: "31/03/2027" }
    asserts:
      - failedTemplate:
          errorPattern: "expires"

  - it: rejects a reason over 1024 characters (the CRD's limit)
    set:
      exceptions.prometheus.policies.disallow-host-path:
        kind: ValidatingAdmissionPolicy
        reason: 
    asserts:
      - failedTemplate:
          errorPattern: "reason"

  - it: rejects an unknown key on a policy exception
    set:
      exceptions.prometheus.policies.disallow-host-path: { kind: ValidatingAdmissionPolicy, namespace: other }
    asserts:
      - failedTemplate:
          errorPattern: "namespace"
