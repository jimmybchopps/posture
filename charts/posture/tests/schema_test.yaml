suite: values schema
templates:
  - templates/*.yaml
tests:
  - it: accepts a valid namePrefix and name-shaped map keys
    set:
      namePrefix: team-a
      sources:
        backup-agent: { namespace: backup, workload: velero }
      destinations:
        license-server: { cidrs: [10.30.0.15/32], ports: [27000] }
      ingress:
        grafana: { sources: { backup-agent: [3000] } }
        any: { from: { any: { namespace: tooling, ports: [8080] } } }
      egress:
        prometheus2: { destinations: { license-server: {} } }
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown top-level key
    set:
      exception:
        legacy: { policies: { require-run-as-non-root: { kind: ValidatingAdmissionPolicy } } }
    asserts:
      - failedTemplate:
          errorPattern: "exception"

  - it: rejects a mesh that isn't supported yet
    set:
      mesh: linkerd
    asserts:
      - failedTemplate:
          errorPattern: "mesh"

  - it: rejects a misspelled networkPolicy direction
    set:
      networkPolicy:
        ingres: false
    asserts:
      - failedTemplate:
          errorPattern: "ingres"

  - it: rejects a non-boolean allowDNS
    set:
      allowDNS: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "allowDNS"

  - it: rejects an empty trustDomain
    set:
      trustDomain: ""
    asserts:
      - failedTemplate:
          errorPattern: "trustDomain"

  - it: rejects a namePrefix that isn't a valid name part
    set:
      namePrefix: Team_A
    asserts:
      - failedTemplate:
          errorPattern: "namePrefix"

  - it: rejects an uppercase key in ingress
    set:
      ingress:
        Grafana: { sources: { monitoring: [3000] } }
    asserts:
      - failedTemplate:
          errorPattern: "Grafana"

  - it: rejects a key with an underscore in sources
    set:
      sources:
        backup_agent: { cidrs: [10.0.0.0/8] }
    asserts:
      - failedTemplate:
          errorPattern: "backup_agent"

  - it: rejects a key ending in a hyphen in destinations
    set:
      destinations:
        vault-: { cidrs: [10.0.0.0/8], ports: [8200] }
    asserts:
      - failedTemplate:
          errorPattern: "vault-"

  - it: rejects a key with a dot in egress
    set:
      egress:
        grafana.v2: { destinations: { dns: {} } }
    asserts:
      - failedTemplate:
          errorPattern: "grafana.v2"

  # Ports
  - it: rejects a named port
    set:
      ingress.grafana.from.renderer: { ports: [http] }
    asserts:
      - failedTemplate: {}

  - it: rejects a named port in a port object
    set:
      ingress.grafana.from.renderer: { ports: [{ port: http }] }
    asserts:
      - failedTemplate: {}

  - it: rejects an empty ports list
    set:
      ingress.grafana.from.renderer: { ports: [] }
    asserts:
      - failedTemplate: {}

  - it: rejects an entry without ports
    set:
      ingress.grafana.from.renderer: { namespace: x }
    asserts:
      - failedTemplate: {}

  - it: rejects a sources reference without ports
    set:
      ingress.grafana.sources.monitoring: []
    asserts:
      - failedTemplate: {}

  - it: rejects port 0 and port 65536
    set:
      ingress.grafana.from.renderer: { ports: [0, 65536] }
    asserts:
      - failedTemplate: {}

  - it: rejects an unknown protocol
    set:
      ingress.grafana.from.renderer: { ports: [{ port: 53, protocol: ICMP }] }
    asserts:
      - failedTemplate: {}

  - it: rejects a misspelled ports key
    set:
      ingress.grafana.from.renderer: { port: [3000] }
    asserts:
      - failedTemplate: {}

  # Selectors and any
  - it: rejects an unknown selector
    set:
      ingress.grafana: { selector: label, from: { renderer: { ports: [3000] } } }
    asserts:
      - failedTemplate: {}

  - it: rejects a selector on from.any
    set:
      ingress.grafana.from.any: { selector: instance, ports: [3000] }
    asserts:
      - failedTemplate: {}

  - it: rejects a serviceAccount on to.any
    set:
      egress.grafana.to.any: { serviceAccount: x, ports: [3000] }
    asserts:
      - failedTemplate: {}

  - it: rejects serviceAccount any
    set:
      ingress.grafana.from.keycloak: { serviceAccount: any, ports: [3000] }
    asserts:
      - failedTemplate: {}

  - it: rejects serviceAccount any on a source definition
    set:
      sources.monitoring: { serviceAccount: any }
    asserts:
      - failedTemplate: {}

  - it: rejects any as a source name
    set:
      sources.any: { namespace: x, workload: y }
    asserts:
      - failedTemplate: {}

  - it: rejects any as a sources reference
    set:
      ingress.grafana.sources.any: [3000]
    asserts:
      - failedTemplate: {}

  - it: rejects any as a destinations reference
    set:
      egress.grafana.destinations: { any: {} }
    asserts:
      - failedTemplate: {}

  # Entry shapes
  - it: rejects cidrs together with namespace in a from entry
    set:
      ingress.grafana.from.office: { cidrs: [10.0.0.0/8], namespace: x, ports: [3000] }
    asserts:
      - failedTemplate: {}

  - it: rejects a malformed CIDR
    set:
      ingress.grafana.from.office: { cidrs: [10.0.0.0], ports: [3000] }
    asserts:
      - failedTemplate: {}

  - it: rejects an out-of-range CIDR
    set:
      destinations.x: { cidrs: [10.0.0.256/8], ports: [1] }
    asserts:
      - failedTemplate: {}

  - it: accepts IPv6 CIDRs and except lists
    set:
      ingress.grafana.from.office: { cidrs: ["2001:db8::/32", { cidr: 10.0.0.0/8, except: [10.1.0.0/16] }], ports: [3000] }
    asserts:
      - notFailedTemplate: {}

  - it: rejects an ingress rule with neither from nor sources
    set:
      ingress.grafana: { selector: app }
    asserts:
      - failedTemplate: {}

  - it: rejects an empty from map
    set:
      ingress.grafana: { from: {} }
    asserts:
      - failedTemplate: {}

  - it: rejects an egress rule with neither to nor destinations
    set:
      egress.grafana: { selector: app }
    asserts:
      - failedTemplate: {}

  - it: rejects ports on a source definition
    set:
      sources.monitoring: { ports: [9090] }
    asserts:
      - failedTemplate: {}

  - it: rejects an empty podSelector
    set:
      sources.monitoring: { podSelector: {} }
    asserts:
      - failedTemplate: {}

  - it: rejects requiresMesh in user values
    set:
      destinations.egress-gateway: { requiresMesh: { mesh: none } }
    asserts:
      - failedTemplate: {}

  - it: accepts authorization.enabled false
    set:
      mesh: istio
      authorization.enabled: false
    asserts:
      - notFailedTemplate: {}

  - it: rejects a non-boolean authorization.enabled
    set:
      authorization.enabled: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "authorization"

  - it: rejects an unknown key under authorization
    set:
      authorization.mode: strict
    asserts:
      - failedTemplate:
          errorPattern: "authorization"

  - it: accepts every mtls mode except DISABLE
    set:
      mesh: istio
      mtls.mode: inherit
    asserts:
      - notFailedTemplate: {}

  - it: rejects mtls mode DISABLE
    set:
      mtls.mode: DISABLE
    asserts:
      - failedTemplate:
          errorPattern: "mtls"

  - it: accepts exclusions as a list or as selector and ports
    set:
      mesh: istio
      mtls.exclusions.api: [8081]
      mtls.exclusions.web: { selector: instance, ports: [9090] }
    asserts:
      - notFailedTemplate: {}

  - it: rejects exclusions.any
    set:
      mesh: istio
      mtls.exclusions.any: [8081]
    asserts:
      - failedTemplate:
          errorPattern: "any"

  - it: rejects a port object in exclusions (single TCP port numbers only)
    set:
      mesh: istio
      mtls.exclusions.api: [{ port: 8081, protocol: UDP }]
    asserts:
      - failedTemplate:
          errorPattern: "exclusions"

  - it: rejects an empty exclusion port list
    set:
      mesh: istio
      mtls.exclusions.api: []
    asserts:
      - failedTemplate:
          errorPattern: "exclusions"

  - it: accepts every exceptions field
    set:
      policyExceptions.enabled: true
      exceptions:
        prometheus:
          selector: instance
          policies:
            disallow-host-path: { kind: ValidatingAdmissionPolicy, reason: why, expires: "2027-03-31", enabled: true }
            add-default-resources: { kind: MutatingAdmissionPolicy }
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown policyExceptions key
    set:
      policyExceptions.enable: true
    asserts:
      - failedTemplate:
          errorPattern: "enable"

  - it: rejects exceptions.any
    set:
      exceptions.any.policies.disallow-host-path: { kind: ValidatingAdmissionPolicy }
    asserts:
      - failedTemplate: {}

  - it: rejects exceptions without policies
    set:
      exceptions.prometheus: { selector: name }
    asserts:
      - failedTemplate:
          errorPattern: "policies"

  - it: rejects an empty policies map
    set:
      exceptions.prometheus.policies: {}
    asserts:
      - failedTemplate: {}

  - it: rejects a policy name that isn't a DNS label
    set:
      exceptions.prometheus.policies.Disallow_Host_Path: { kind: ValidatingAdmissionPolicy }
    asserts:
      - failedTemplate: {}

  - it: rejects a policy name over 63 characters
    set:
      exceptions.prometheus.policies.a-policy-name-that-is-much-longer-than-sixty-three-characters-long: { kind: ValidatingAdmissionPolicy }
    asserts:
      - failedTemplate: {}

  - it: requires kind
    set:
      exceptions.prometheus.policies.disallow-host-path: { reason: why }
    asserts:
      - failedTemplate:
          errorPattern: "kind"

  - it: rejects an unknown kind
    set:
      exceptions.prometheus.policies.disallow-host-path: { kind: ClusterPolicy }
    asserts:
      - failedTemplate:
          errorPattern: "kind"

  - it: rejects a malformed expires
    set:
      exceptions.prometheus.policies.disallow-host-path: { kind: ValidatingAdmissionPolicy, expires: "31/03/2027" }
    asserts:
      - failedTemplate:
          errorPattern: "expires"

  - it: rejects a reason over 1024 characters (the CRD's limit)
    set:
      exceptions.prometheus.policies.disallow-host-path:
        kind: ValidatingAdmissionPolicy
        reason: 
    asserts:
      - failedTemplate:
          errorPattern: "reason"

  - it: rejects an unknown key on a policy exception
    set:
      exceptions.prometheus.policies.disallow-host-path: { kind: ValidatingAdmissionPolicy, namespace: other }
    asserts:
      - failedTemplate:
          errorPattern: "namespace"

  # enabled (phase 5a)
  - it: accepts enabled on rules, peers, references, and exclusions
    set:
      mesh: istio
      ingress.grafana:
        enabled: false
        from: { renderer: { ports: [3000], enabled: false }, any: { namespace: tooling, ports: [3000], enabled: true } }
        sources: { monitoring: [3000], ingress-gateway: { ports: [3000], enabled: false } }
      ingress.api.from.vpn: { cidrs: [10.50.0.0/16], ports: [8080], enabled: false }
      egress.grafana:
        enabled: true
        to: { keycloak: { namespace: keycloak, ports: [8080], enabled: false } }
        destinations: { postgres: {}, sso: { enabled: false } }
      mtls.exclusions.api: { ports: [8081], enabled: false }
    asserts:
      - notFailedTemplate: {}

  - it: rejects a non-boolean enabled on a rule
    set:
      ingress.grafana: { enabled: "no", from: { renderer: { ports: [3000] } } }
    asserts:
      - failedTemplate: {}

  - it: rejects a non-boolean enabled on a peer
    set:
      egress.grafana.to.keycloak: { namespace: keycloak, ports: [8080], enabled: "false" }
    asserts:
      - failedTemplate: {}

  - it: rejects a non-boolean enabled on an exclusion
    set:
      mesh: istio
      mtls.exclusions.api: { ports: [8081], enabled: "no" }
    asserts:
      - failedTemplate: {}

  - it: rejects a sources reference object without ports
    set:
      ingress.grafana.sources.monitoring: { enabled: false }
    asserts:
      - failedTemplate: {}

  - it: rejects an unknown key on a sources reference object
    set:
      ingress.grafana.sources.monitoring: { ports: [3000], namespace: x }
    asserts:
      - failedTemplate: {}

  - it: rejects destinations as a list (it's a map, so layered values merge)
    set:
      egress.grafana.destinations: [postgres]
    asserts:
      - failedTemplate: {}

  - it: rejects an unknown key on a destinations reference
    set:
      egress.grafana.destinations.postgres: { ports: [5433] }
    asserts:
      - failedTemplate: {}

  - it: rejects a non-boolean enabled on a destinations reference
    set:
      egress.grafana.destinations.postgres: { enabled: "no" }
    asserts:
      - failedTemplate: {}

  - it: rejects enabled on a source or destination definition (only references take it)
    set:
      destinations.vault: { namespace: vault, workload: vault, ports: [8200], enabled: false }
    asserts:
      - failedTemplate: {}

  # Profiles (phase 5c)
  - it: accepts every profile and setting
    release:
      namespace: x
    set:
      profiles:
        istio-system: { settings: { apiServerCidrs: [10.0.0.0/24] } }
        istio-ingress: { enabled: true, settings: { ports: [8443], clientCidrs: [203.0.113.0/24] } }
        istio-egress: { enabled: false, settings: { ports: [443] } }
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown profile
    set:
      profiles.istio-sytem: {}
    asserts:
      - failedTemplate: {}

  - it: rejects an unknown profile setting
    set:
      profiles.istio-ingress.settings.port: [443]
    asserts:
      - failedTemplate: {}

  - it: rejects a malformed profile setting
    set:
      profiles.istio-system.settings.apiServerCidrs: [not-a-cidr]
    asserts:
      - failedTemplate: {}

  - it: rejects a non-boolean meshMember
    set:
      meshMember: "no"
    asserts:
      - failedTemplate: {}

  - it: accepts partial entries, so a profile's can be overridden or switched off
    release:
      namespace: x
    set:
      profiles.istio-ingress: {}
      ingress.any.from.clients: { enabled: false }
      egress.any: { enabled: false }
    asserts:
      - notFailedTemplate: {}

  # Egress to hostnames (egress.allowedHosts)
  - it: accepts allowedHosts entries
    set:
      mesh: istio
      egress.allowedHosts:
        github: { hosts: [api.github.com], ports: [443], protocol: TLS, gateway: legacy, enabled: true }
        content: { hosts: ["*.githubusercontent.com"], ports: [443] }
        db: { addresses: [203.0.113.10, 198.51.100.0/24, "2001:db8::/32"], ports: [5432], protocol: TCP }
    asserts:
      - notFailedTemplate: {}

  - it: rejects port objects in allowedHosts
    set:
      egress.allowedHosts.github: { hosts: [api.github.com], ports: [{ port: 443 }] }
    asserts:
      - failedTemplate:
          errorPattern: "allowedHosts/github/ports/0"

  - it: rejects named ports in allowedHosts
    set:
      egress.allowedHosts.github: { hosts: [api.github.com], ports: [https] }
    asserts:
      - failedTemplate:
          errorPattern: "allowedHosts/github/ports/0"

  - it: rejects a URL as a host
    set:
      egress.allowedHosts.github: { hosts: ["https://api.github.com"], ports: [443] }
    asserts:
      - failedTemplate:
          errorPattern: "allowedHosts/github/hosts/0"

  - it: rejects a wildcard that isn't the leading label
    set:
      egress.allowedHosts.github: { hosts: ["a.*.com"], ports: [443] }
    asserts:
      - failedTemplate:
          errorPattern: "allowedHosts/github/hosts/0"

  - it: rejects a bad address
    set:
      egress.allowedHosts.db: { addresses: [203.0.113.300], ports: [5432], protocol: TCP }
    asserts:
      - failedTemplate:
          errorPattern: "allowedHosts/db/addresses/0"

  - it: rejects an unknown protocol
    set:
      egress.allowedHosts.db: { addresses: [203.0.113.10], ports: [5432], protocol: UDP }
    asserts:
      - failedTemplate:
          errorPattern: "allowedHosts/db/protocol"

  - it: rejects an unknown field in an allowedHosts entry
    set:
      egress.allowedHosts.github: { hosts: [api.github.com], ports: [443], host: api.github.com }
    asserts:
      - failedTemplate:
          errorPattern: "host"

  - it: allowedHosts is reserved under egress only
    set:
      ingress.allowedHosts.from.any: { ports: [443] }
    asserts:
      - failedTemplate:
          errorPattern: "allowedHosts"
