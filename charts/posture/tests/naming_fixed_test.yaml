suite: naming of fixed objects (the CLAUDE.md fixed-objects table)
templates:
  - templates/networkpolicy/default-deny.yaml
  - templates/networkpolicy/same-namespace.yaml
  - templates/networkpolicy/ambient-probes.yaml
  - templates/istio/peerauthentication.yaml
tests:
  - it: default deny, one object per direction
    asserts:
      - equal: { path: metadata.name, value: deny-all-ingress }
        template: templates/networkpolicy/default-deny.yaml
        documentIndex: 0
      - equal: { path: metadata.name, value: deny-all-egress }
        template: templates/networkpolicy/default-deny.yaml
        documentIndex: 1

  - it: allowSameNamespace
    asserts:
      - equal: { path: metadata.name, value: allow-same-namespace }
        template: templates/networkpolicy/same-namespace.yaml

  - it: Istio ambient kubelet probes
    set:
      mesh: istio
    asserts:
      - equal: { path: metadata.name, value: allow-ingress-from-ambient-probes-to-all }
        template: templates/networkpolicy/ambient-probes.yaml

  - it: mTLS for the namespace, mtls-<mode>
    set:
      mesh: istio
    asserts:
      - equal: { path: metadata.name, value: mtls-strict }
        template: templates/istio/peerauthentication.yaml
        documentIndex: 0

  - it: mTLS PERMISSIVE
    set:
      mesh: istio
      mtls.mode: PERMISSIVE
    asserts:
      - equal: { path: metadata.name, value: mtls-permissive }
        template: templates/istio/peerauthentication.yaml

  - it: an mTLS exclusion, allow-plaintext-to-<workload>
    set:
      mesh: istio
      mtls.exclusions.grafana: [9090]
    asserts:
      - equal: { path: metadata.name, value: allow-plaintext-to-grafana }
        template: templates/istio/peerauthentication.yaml
        documentIndex: 1
