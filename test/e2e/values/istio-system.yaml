# posture in istio-system under MESH=istio: the istio-system profile (istiod's and ztunnel's
# exceptions and traffic, meshMember: false). Installed before Istio, after the policy chart, with
# mesh: none, and upgraded with mesh: istio once Istio is in (install_platform_posture and
# upgrade_platform_posture in test/e2e/lib.sh). apiServerCidrs is set at run time to the k3d
# Docker network, where the API server's webhook calls come from.
#
# A missing exception shows up as a FailedCreate event naming the policy (run.sh prints them
# when the Istio install fails); a missing rule, as istiod or ztunnel failing to become ready.
# Either is a fix to the profile (charts/posture/templates/_profiles.tpl), not to this file.
profiles:
  istio-system: {}
