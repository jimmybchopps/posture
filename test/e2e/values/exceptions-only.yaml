# posture rendering only posture-exceptions (empty unless exceptions are set): no
# NetworkPolicies, mesh none. Installed in every namespace when it's created under the policy
# chart, as posture is the first release in any namespace, so pods there are admitted before
# the scenario's own posture values are applied (install_posture upgrades this release).
mesh: none
networkPolicy: { ingress: false, egress: false }
