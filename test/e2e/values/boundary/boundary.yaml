# boundary in the boundary scenario (the pinned release, BOUNDARY_CHART): the https ingress
# gateway (ClusterIP, since the client is in the cluster) for every name under e2e.test, with
# the certificate apps-tls (*.shop.e2e.test, made by the scenario), and the default egress
# waypoint allowing one host. apps asks posture for allowed-tls and denied-tls; only
# allowed-tls is on this list.
#
# Mesh-wide mTLS is left to the namespaces (inherit): it's boundary's to test, and STRICT
# mesh-wide would refuse the plaintext client's baseline connection to shop that the
# NetworkPolicy deny below relies on.
mesh: istio
mtls:
  mode: inherit
ingress:
  gateways:
    https:
      service: { type: ClusterIP }
      listeners:
        https:
          hostname: "*.e2e.test"
          certificates: [apps-tls]
        http:
          hostname: "*.e2e.test"
egress:
  gateways:
    default:
      allowedHosts:
        allowed-tls:
          hosts: [allowed-tls.e2e.test]
          ports: [443]
          protocol: TLS
