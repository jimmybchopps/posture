# The pinned policy chart, as e2e installs it (by the exceptions scenario under MESH=none,
# before Istio otherwise): the baked-in baseline (always enforced) with the registries the e2e
# images come from, and every other optional policy at audit, so the test pods only have to meet
# the baseline. Images are matched as plain prefixes, so they're written fully qualified.
enforcement: audit
policies:
  restrict-image-registries:
    registries:
      - registry.k8s.io/          # agnhost
      - docker.io/curlimages/     # curl (CURL_IMAGE)
      - docker.io/istio/          # istiod, istio-cni, ztunnel
  # Enforced, unlike the other optional policies: Istio's own pods carry the opt-out markers it
  # refuses (sidecar.istio.io/inject=false, istio.io/dataplane-mode=none), so istiod and
  # ztunnel start only because the istio-system profile excepts them. A refused component is a
  # fix to that profile (its FailedCreate event names the policy).
  disallow-mesh-opt-out:
    action: enforce
